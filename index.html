<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElMaterial</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px}.wrap{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:15px}.search,input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;margin:5px 0 12px}button,.btn{padding:10px 13px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.product{display:flex;gap:12px}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px}.ean{font-family:monospace;background:#eee;padding:4px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:white;padding:20px;border-radius:15px;width:min(520px,100%);max-height:90vh;overflow:auto}.hidden{display:none}.muted{color:#6b7280}
</style></head><body><header><div class="wrap"><b>⚡ ElMaterial</b><span id="actions" style="float:right"></span></div></header><main class="wrap"><div id="app"></div></main><div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://rcptpcvmtlpeglojrtwi.supabase.co",KEY="sb_publishable_pXasQ7RfCZVQNE3VgvO6eA_DpQgz_bW",db=supabase.createClient(URL,KEY);
let C=[],S=[],P=[],page="home",cat=null,sub=null,q="";
const e=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){let [c,s,p]=await Promise.all([db.from("categories").select("*").order("id"),db.from("subcategories").select("*").order("id"),db.from("products").select("*").order("id")]);if(c.error||s.error||p.error){document.querySelector("#app").innerHTML="<div class=card>Kunde inte läsa databasen. Kontrollera RLS.</div>";return}C=c.data;S=s.data;P=p.data}
async function admin(){let {data:{user}}=await db.auth.getUser();if(!user)return false;let {data}=await db.from("profiles").select("is_admin").eq("id",user.id).maybeSingle();return !!data?.is_admin}
async function boot(){let {data:{session}}=await db.auth.getSession();if(!session)return login();await load();draw()}
function login(){document.querySelector("#actions").innerHTML="";app.innerHTML='<div class=card style="max-width:420px;margin:50px auto"><h1>⚡ ElMaterial</h1><p class=muted>Logga in</p><input id=em type=email placeholder="E-post"><input id=pw type=password placeholder="Lösenord"><button class=primary onclick="signin()">Logga in</button><p id=msg></p></div>'}
async function signin(){let {error}=await db.auth.signInWithPassword({email:em.value,password:pw.value});if(error){msg.textContent=error.message;return}await load();draw()}
async function draw(){let a=await admin();actions.innerHTML=(a?'<button onclick="openAdmin()">⚙ Admin</button> ':'')+'<button onclick="logout()">Logga ut</button>';if(page==="home")home();else if(page==="cat")category();else if(page==="sub")products();else if(page==="search")search()}
function searchbox(){return `<input class=search placeholder="🔎 Sök produkt, E-nummer eller tillverkare" value="${e(q)}" oninput="q=this.value;page=q?'search':'home';draw()">`}
function home(){app.innerHTML=searchbox()+"<h1>Kategorier</h1><div class=grid>"+C.map(c=>`<div class=card onclick="cat=${c.id};page='cat';draw()"><h2>${e(c.icon||'📁')} ${e(c.name)}</h2><span class=muted>${S.filter(s=>s.category_id===c.id).length} underkategorier</span></div>`).join("")+"</div>"}
function category(){let c=C.find(x=>x.id===cat);app.innerHTML=searchbox()+`<button onclick="page='home';draw()">← Alla kategorier</button><h1>${e(c.name)}</h1><div class=grid>`+S.filter(s=>s.category_id===cat).map(s=>`<div class=card onclick="sub=${s.id};page='sub';draw()"><h3>📁 ${e(s.name)}</h3><span class=muted>${P.filter(p=>p.subcategory_id===s.id).length} produkter</span></div>`).join("")+"</div>"}
function products(){let s=S.find(x=>x.id===sub),ps=P.filter(p=>p.subcategory_id===sub);app.innerHTML=searchbox()+`<button onclick="page='cat';draw()">← Tillbaka</button><h1>📁 ${e(s.name)}</h1><div class=grid>`+(ps.length?ps.map(card).join(""):"<div class=card>Inga produkter ännu.</div>")+"</div>"}
function card(p){return `<div class="card product"><img src="${e(p.image_url||'https://placehold.co/300x200?text=Produkt')}"><div><h3>${e(p.name)}</h3><span class=muted>${e(p.manufacturer)}</span><p><span class=ean>${e(p.e_number)}</span></p><button class=primary onclick="show(${p.id})">Visa</button></div></div>`}
function show(id){let p=P.find(x=>x.id===id);app.innerHTML=`<button onclick="page='home';draw()">← Startsida</button><div class=card style="margin-top:12px"><img style="width:100%;max-height:350px;object-fit:contain" src="${e(p.image_url||'https://placehold.co/600x400?text=Produkt')}"><h1>${e(p.name)}</h1><p>${e(p.manufacturer)}</p><p><b>E-nummer:</b> <span class=ean>${e(p.e_number)}</span> <button onclick="navigator.clipboard.writeText('${e(p.e_number)}')">Kopiera</button></p><a class="btn primary" href="${e(p.manufacturer_url||'#')}" target=_blank>🌐 Tillverkarens hemsida</a></div>`}
function search(){let x=q.toLowerCase(),ps=P.filter(p=>[p.name,p.e_number,p.manufacturer].some(v=>String(v||'').toLowerCase().includes(x)));app.innerHTML=searchbox()+"<h1>Sökresultat</h1><div class=grid>"+(ps.length?ps.map(card).join(""):"<div class=card>Ingen produkt hittades.</div>")+"</div>"}
function openAdmin(){modal.classList.remove("hidden");modal.innerHTML=`<div class=modalbox><h2>⚙ Lägg till produkt</h2><input id=n placeholder="Produktnamn"><input id=en placeholder="E-nummer"><input id=br placeholder="Tillverkare"><select id=ca onchange="subs()">${C.map(c=>`<option value=${c.id}>${e(c.name)}</option>`).join("")}</select><select id=su>${S.filter(s=>s.category_id===C[0]?.id).map(s=>`<option value=${s.id}>${e(s.name)}</option>`).join("")}</select><input id=im placeholder="Bild-URL"><input id=mu placeholder="Tillverkarens hemsida"><input id=no placeholder="Anteckningar"><button class=primary onclick="add()">Spara</button> <button onclick="modal.classList.add('hidden')">Stäng</button></div>`}
function subs(){su.innerHTML=S.filter(s=>s.category_id==ca.value).map(s=>`<option value=${s.id}>${e(s.name)}</option>`).join("")}
async function add(){let o={name:n.value,e_number:en.value,manufacturer:br.value,subcategory_id:Number(su.value),image_url:im.value||null,manufacturer_url:mu.value||null,notes:no.value||null};let {error}=await db.from("products").insert(o);if(error){alert(error.message);return}modal.classList.add("hidden");await load();draw();alert("Produkten sparades i molnet!")}
async function logout(){await db.auth.signOut();login()}
boot();
</script></body></html>
